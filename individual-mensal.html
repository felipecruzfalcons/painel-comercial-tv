<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel Individual Mensal — SeuBoné</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #030304;
    --card-bg: #171a21;
    --card-bg-2: #1d212b;
    --borda: #2a2f3a;
    --azul: #4f8cff;
    --dourado: #ffcf33;
    --cinza: #9aa1ac;
    --cinza-bg: #20242e;
    --verde: #3ddc97;
    --ambar: #fbbf24;
    --vermelho: #ff6b6b;
    --texto: #f3f4f6;
    --texto-sub: #9aa1ac;
    --grid-linha: rgba(255,255,255,0.06);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #dde0e5;
    --card-bg: #eceef1;
    --card-bg-2: #e4e7eb;
    --borda: #e4e6ea;
    --azul: #1e40af;
    --dourado: #b8860b;
    --cinza: #6b7280;
    --cinza-bg: #d7dbe1;
    --verde: #16a34a;
    --ambar: #d97706;
    --vermelho: #dc2626;
    --texto: #111827;
    --texto-sub: #6b7280;
    --grid-linha: rgba(0,0,0,0.08);
  }
  body { transition: background-color .25s ease, color .25s ease; }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--texto);
    padding: 10px 24px 12px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .header { flex: none; display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:6px; flex-wrap:wrap; gap:10px; }
  .header .logo { height: 28px; width:auto; display:block; margin-bottom:2px; }
  :root[data-theme="light"] .header .logo { filter: brightness(0); }
  .header .brand-sub { font-size:11px; font-weight:700; letter-spacing:.1em; color:var(--texto-sub); text-transform:uppercase; }
  .header .semana { font-size:18px; font-weight:800; margin-top:1px; }
  .header .meta-info { text-align:right; font-size:12px; color:var(--texto-sub); }
  .link-outro-painel { display:block; margin-top:2px; font-size:12px; color:var(--texto-sub); text-decoration:none; }
  .link-outro-painel:hover { color:var(--dourado); }
  .theme-toggle {
    margin-top: 4px; border: 1px solid var(--borda); background: var(--card-bg); color: var(--texto);
    font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 999px; cursor: pointer;
  }
  .theme-toggle:hover { border-color: var(--dourado); }
  #conteudo { position:relative; flex:1 1 auto; min-height:0; overflow:hidden; }
  .pagina {
    position:absolute; inset:0; overflow:hidden;
    opacity:0; visibility:hidden;
    transition: opacity .7s ease;
    display:flex;
  }
  .pagina.pagina-ativa { opacity:1; visibility:visible; }
  .card { background:var(--card-bg); border:1px solid var(--borda); border-radius:18px; padding:10px 20px 6px; width:100%; min-width:0; min-height:0; display:flex; flex-direction:column; }
  .card-titulo { font-weight:800; font-style:italic; text-transform:uppercase; font-size:15px; margin-bottom:4px; letter-spacing:.02em; flex:none; }
  .chart-wrap { position:relative; flex:1 1 auto; min-height:0; }
  .empty-msg { padding:44px; text-align:center; color:var(--texto-sub); }
  .pagina-nav { position:fixed; right:10px; bottom:6px; display:flex; gap:4px; z-index:50; opacity:.3; transition:opacity .2s ease; }
  .pagina-nav:hover { opacity:1; }
  .pagina-nav-btn { width:18px; height:18px; border-radius:50%; border:1px solid var(--borda); background:var(--card-bg); color:var(--texto-sub); font-size:11px; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
  .pagina-nav-btn:hover { border-color:var(--dourado); color:var(--dourado); }

  /* ===== Corrida em barras (ranking) — substitui o gráfico de linhas cruzadas: 1 linha por
     vendedor, sempre com nome visível em cima, foto e barra colorida pelo SQUAD (dourado =
     Falcons/Maverick, branco = Stark/Nexus). --linha-h é recalculada em JS a partir da
     altura real disponível ÷ número de vendedores, pra tudo caber sem cortar. */
  .barra-lista { display:flex; flex-direction:column; flex:1 1 auto; min-height:0; overflow:hidden; --linha-h: 50px; }
  .barra-row { flex:1 1 0; min-height:0; display:flex; align-items:center; gap:calc(var(--linha-h) * 0.22); padding:0 6px; border-radius:8px; cursor:pointer; }
  .barra-row:hover { background:var(--cinza-bg); }
  .barra-row.aberta { background:var(--cinza-bg); }
  .barra-rank { flex:none; width:calc(var(--linha-h) * 0.5); text-align:center; font-weight:800; color:var(--texto-sub); font-size:calc(var(--linha-h) * 0.2); }
  /* Foto ocupa a MESMA altura do bloco nome+barra (align-self:stretch + aspect-ratio:1
     mantém redonda) — pedido do Felipe pra foto ficar maior, acompanhando o espaço total
     da linha, e não um círculo pequeno e fixo. */
  .barra-avatar { flex:none; align-self:stretch; height:auto; width:auto; aspect-ratio:1/1; border-radius:50%; object-fit:cover; border:2px solid var(--dourado); }
  .barra-corpo { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:2px; }
  .barra-nome { font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:calc(var(--linha-h) * 0.24); }
  .barra-area { position:relative; height:calc(var(--linha-h) * 0.55); background:var(--cinza-bg); border-radius:6px; }
  .barra-fill { position:absolute; left:0; top:0; height:100%; border-radius:6px 3px 3px 6px; min-width:4%; display:flex; align-items:center; justify-content:flex-end; transition:width .5s ease; }
  .barra-fill.cor-verde { background:linear-gradient(180deg, #6dffb3 0%, #00e676 45%, #009e56 100%); }
  .barra-fill.cor-amber { background:linear-gradient(180deg, #ffe066 0%, #ffb300 45%, #c77800 100%); }
  .barra-fill.cor-vermelho { background:linear-gradient(180deg, #ff9a9a 0%, #ff5252 45%, #c62828 100%); }
  .barra-valor-dentro { margin-right:8px; font-weight:800; font-size:calc(var(--linha-h) * 0.22); white-space:nowrap; color:#1a1a1a; text-shadow:0 1px 0 rgba(255,255,255,.35); }
  .barra-valor-fora { position:absolute; top:50%; transform:translateY(-50%); margin-left:10px; font-weight:800; font-size:calc(var(--linha-h) * 0.22); white-space:nowrap; }

  /* Trajetória semanal (aparece só quando clica numa barra) */
  .detalhe-trajetoria { flex:0 0 auto; background:var(--cinza-bg); border:1px solid var(--dourado); border-radius:10px; padding:8px 14px 4px; margin:2px 0 8px; }
  .detalhe-header { display:flex; justify-content:space-between; align-items:center; font-weight:800; font-size:13px; margin-bottom:2px; }
  .detalhe-fechar { cursor:pointer; color:var(--texto-sub); background:none; border:none; font-size:16px; line-height:1; padding:2px 6px; }
  .detalhe-fechar:hover { color:var(--dourado); }
  .detalhe-chart-wrap { height:130px; position:relative; }
</style>
</head>
<body>

  <div class="header">
    <div>
      <img class="logo" src="logo.png" alt="SeuBoné">
      <div class="semana" id="semanaLabel">Corrida individual</div>
    </div>
    <div class="meta-info">
      <div id="atualizadoLabel">última leitura: —</div>
      <button class="theme-toggle" id="btnTema" onclick="alternarTema()">☀️ Tema claro</button>
      <a class="link-outro-painel" href="index.html">← Painel de vendedores</a>
      <a class="link-outro-painel" href="squads.html">← Painel de squads</a>
    </div>
  </div>

  <div id="conteudo">
    <div class="pagina pagina-ativa">
      <div class="card">
        <div class="empty-msg">Carregando dados da planilha…</div>
      </div>
    </div>
  </div>

  <div class="pagina-nav">
    <button class="pagina-nav-btn" onclick="irPara(-1)" aria-label="Página anterior" title="Página anterior">‹</button>
    <button class="pagina-nav-btn" id="btnPausar" onclick="alternarPausa()" aria-label="Pausar rotação" title="Pausar rotação">⏸</button>
    <button class="pagina-nav-btn" onclick="irPara(1)" aria-label="Próxima página" title="Próxima página">›</button>
  </div>

<script>
// >>> URL do Apps Script (doGet) — mesma URL dos outros 2 painéis <<<
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx_8R_UGyyXDK68tazvTc9wj0-ECxbtCvHHOXArkAtvtTjX5uoe2kVCtnG2uxlkfkMxkA/exec?key=comercialpainel2026";

const REFRESH_MS = 10 * 60 * 1000; // 10 min
const CLOSER_SQUADS = ["FALCONS", "STARK"];
const GC_SQUADS = ["MAVERICK", "NEXUS"];

let ultimoDados = null;
const avatarCache = {}; // nome -> data URL do avatar circular (com borda dourada)

function toNum(v) {
  if (typeof v === "number") return v;
  const n = parseFloat(String(v || "").replace(",", "."));
  return isNaN(n) ? 0 : n;
}
function getInitials(nome) {
  return String(nome || "").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();
}
function slugFoto(nome) {
  return String(nome || "")
    .toUpperCase()
    .normalize("NFD")
    .replace(/[̀-ͯ]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");
}
const EXT_FOTOS = ["jpg", "jpeg", "png", "webp"];

// Tenta carregar a foto do vendedor (cascata de extensões); se nenhuma existir, devolve null
// (o ponto do gráfico cai pra um círculo simples com as iniciais, sem quebrar nada).
function preloadFoto(nome) {
  return new Promise((resolve) => {
    const slug = slugFoto(nome);
    let i = 0;
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = () => {
      i++;
      if (i < EXT_FOTOS.length) { img.src = "fotos/" + slug + "." + EXT_FOTOS[i]; }
      else resolve(null);
    };
    img.src = "fotos/" + slug + "." + EXT_FOTOS[0];
  });
}
// Recorta a foto num círculo com borda dourada — vira o "ponto atual" do vendedor no gráfico.
function avatarCircular(img, nome, size) {
  const canvas = document.createElement("canvas");
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext("2d");
  // Borda/inset em proporção ao tamanho (não em px fixo) — assim, ao aumentar a resolução
  // da imagem de origem (pra ficar nítida em TV grande), a espessura da borda dourada
  // continua com a mesma proporção visual de antes, em vez de ficar fina/sumir.
  const inset = size * (2 / 96);
  const espessuraBorda = size * (4 / 96);
  ctx.save();
  ctx.beginPath();
  ctx.arc(size / 2, size / 2, size / 2 - inset, 0, Math.PI * 2);
  ctx.closePath();
  ctx.clip();
  if (img) {
    ctx.drawImage(img, 0, 0, size, size);
  } else {
    ctx.fillStyle = "#20242e";
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = "#f3f4f6";
    ctx.font = "bold " + Math.round(size * 0.32) + "px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(getInitials(nome), size / 2, size / 2 + 1);
  }
  ctx.restore();
  ctx.beginPath();
  ctx.arc(size / 2, size / 2, size / 2 - inset, 0, Math.PI * 2);
  ctx.lineWidth = espessuraBorda;
  ctx.strokeStyle = "#ffcf33";
  ctx.stroke();
  return canvas;
}

function aplicarTema(tema) {
  document.documentElement.setAttribute("data-theme", tema);
  const btn = document.getElementById("btnTema");
  if (btn) btn.textContent = tema === "dark" ? "☀️ Tema claro" : "🌙 Tema escuro";
  try { localStorage.setItem("painelIndividualMensalTema", tema); } catch (e) {}
  if (ultimoDados) render(ultimoDados);
}
function alternarTema() {
  const atual = document.documentElement.getAttribute("data-theme") || "dark";
  aplicarTema(atual === "dark" ? "light" : "dark");
}
(function iniciarTema() {
  let salvo = "dark";
  try { salvo = localStorage.getItem("painelIndividualMensalTema") || "dark"; } catch (e) {}
  document.documentElement.setAttribute("data-theme", salvo);
})();
(function sincronizarBotaoTema() {
  const tema = document.documentElement.getAttribute("data-theme") || "dark";
  const btn = document.getElementById("btnTema");
  if (btn) btn.textContent = tema === "dark" ? "☀️ Tema claro" : "🌙 Tema escuro";
})();

function corTexto() { return getComputedStyle(document.documentElement).getPropertyValue("--texto").trim(); }
function corTextoSub() { return getComputedStyle(document.documentElement).getPropertyValue("--texto-sub").trim(); }
function corGrid() { return getComputedStyle(document.documentElement).getPropertyValue("--grid-linha").trim(); }

// Extrai o dia (1-31) de uma string de data "yyyy-MM-dd" (ou ISO completo) sem usar o
// construtor Date — evita o fuso horário deslocar o dia (Sheets grava em UTC).
function extrairDia(dataStr) {
  const m = String(dataStr || "").match(/(\d{4})-(\d{2})-(\d{2})/);
  return m ? parseInt(m[3], 10) : 0;
}

// "yyyy-MM" da linha, pra filtrar só o mês corrente. Sem isso, o eixo X (que só olha o
// dia, 1-31, pra não sofrer deslocamento de fuso) misturaria dia 5 de setembro com dia 5
// de agosto assim que a aba de histórico acumular mais de um mês de snapshots — mês novo
// vira automático (não precisa mexer em nada aqui), essa checagem é só o cinto de
// segurança pra nunca misturar mês errado no gráfico.
function extrairAnoMes(dataStr) {
  const m = String(dataStr || "").match(/(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[1] + "-" + m[2] : "";
}
function anoMesAtual() {
  const hoje = new Date();
  return hoje.getFullYear() + "-" + String(hoje.getMonth() + 1).padStart(2, "0");
}

function diasNoMesAtual() {
  const hoje = new Date();
  return new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0).getDate();
}

const MESES_PT = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
function preencherLabelMes() {
  const hoje = new Date();
  const label = document.getElementById("semanaLabel");
  if (label) label.textContent = "CORRIDA INDIVIDUAL MENSAL — " + MESES_PT[hoje.getMonth()] + "/" + hoje.getFullYear();
}
preencherLabelMes();

// Vendedores fora do painel (mesma exclusão do painel 1).
const EXCLUDE_VENDEDORES = ["HADYJA SARAIVA", "P MARANHAO", "P MARANHÃO"];

// Linha 0 da planilha de histórico é o cabeçalho ["Data","Vendedor","Squad","Resultado"].
function parseHistorico(payload) {
  const mesAtual = anoMesAtual();
  const rows = (payload.rows || []).slice(1).filter(r => r[0] && r[1] && extrairAnoMes(r[0]) === mesAtual);
  const porVendedor = {};
  rows.forEach(r => {
    const dia = extrairDia(r[0]);
    const nome = String(r[1]).trim();
    const squad = String(r[2] || "").trim().toUpperCase();
    const pct = toNum(r[3]);
    if (!dia || !nome) return;
    if (EXCLUDE_VENDEDORES.includes(nome.toUpperCase())) return;
    if (!porVendedor[nome]) porVendedor[nome] = { nome, squad, pontos: [] };
    porVendedor[nome].pontos.push({ dia, pct });
  });
  const lista = Object.values(porVendedor);
  lista.forEach(v => v.pontos.sort((a, b) => a.dia - b.dia));
  return lista;
}

// Cor do % pela PROJEÇÃO de fechamento do mês (não pelo % acumulado até hoje).
// Ex.: dia 17 de um mês de 31 dias, 77,4% acumulado → ritmo projeta 77,4% * (31/17) = 141% →
// verde, porque no ritmo atual o vendedor fecha acima da meta.
function corPorProjecao(projecao) {
  if (projecao >= 1) return "#3ddc97";
  if (projecao >= 0.7) return "#fbbf24";
  return "#ff6b6b";
}
function projetarFechamento(pctAtual, diaAtual, diasNoMes) {
  if (!diaAtual) return pctAtual;
  return pctAtual * (diasNoMes / diaAtual);
}

async function garantirAvatares(vendedores) {
  await Promise.all(vendedores.map(async v => {
    if (!(v.nome in avatarCache)) {
      const img = await preloadFoto(v.nome);
      // Fonte em resolução bem mais alta que o tamanho exibido — evita ficar borrado
      // quando a TV é grande/4K e a foto acaba desenhada maior que 96px na tela.
      // Agora vira <img> (não mais desenhada num canvas do Chart.js), então guarda como
      // data URL — o avatar circular com borda dourada já sai pronto do avatarCircular().
      avatarCache[v.nome] = avatarCircular(img, v.nome, 240).toDataURL("image/png");
    }
  }));
}

// Quinta-feira 23h59 = fechamento semanal oficial (ritual da empresa). Usa o mês/ano
// atuais pra descobrir em qual dia do mês cada quinta cai.
function ehFechamentoSemanal(dia) {
  const hoje = new Date();
  return new Date(hoje.getFullYear(), hoje.getMonth(), dia).getDay() === 4; // 4 = quinta
}

// "DD/MM" a partir do dia do mês (mês/ano = os atuais, já que o histórico só guarda o mês
// corrente — ver extrairAnoMes).
function formatarDataCurta(dia) {
  const hoje = new Date();
  return String(dia).padStart(2, "0") + "/" + String(hoje.getMonth() + 1).padStart(2, "0");
}

// Pontos da trajetória semanal de UM vendedor: só os fechamentos de quinta-feira do mês +
// o dia mais recente com dado (o "em andamento" da semana atual) — mesma regra de sempre,
// calculada agora só sob demanda (quando o usuário clica pra abrir a trajetória de alguém),
// não mais pra todo mundo de uma vez.
function pontosSemanaisDe(v) {
  if (!v.pontos.length) return [];
  const ultimoDia = v.pontos[v.pontos.length - 1].dia;
  return v.pontos.filter(p => ehFechamentoSemanal(p.dia) || p.dia === ultimoDia);
}

// Status (verde/âmbar/vermelho) a partir da PROJEÇÃO de fechamento do mês — mesma régua de
// corPorProjecao (que devolve o hex), só que aqui devolve o nome pra virar classe CSS do
// gradiente da barra.
function statusProjecao(projecao) {
  if (projecao >= 1) return "verde";
  if (projecao >= 0.7) return "amber";
  return "vermelho";
}

// Monta a lista ordenada (maior % primeiro) pra desenhar em barras — 1 linha por vendedor.
// Cor do NOME pelo SQUAD (Falcons/Maverick = dourado, Stark/Nexus = branco — regra de
// sempre). Cor da BARRA (e do número) pela PROJEÇÃO de fechamento do mês (verde = no ritmo
// de bater a meta, âmbar = atenção, vermelho = abaixo do esperado) — pedido do Felipe pra
// a barra virar o sinal de performance, e o nome carregar a identidade do squad.
function prepararListaBarras(vendedores) {
  const diasTotais = diasNoMesAtual();
  return vendedores
    .map(v => {
      const ultimo = v.pontos.length ? v.pontos[v.pontos.length - 1] : { dia: 0, pct: 0 };
      const projecao = projetarFechamento(ultimo.pct, ultimo.dia, diasTotais);
      return {
        nome: v.nome,
        squad: v.squad,
        pct: ultimo.pct,
        corBarra: "cor-" + statusProjecao(projecao),
        corValor: corPorProjecao(projecao),
        corNome: (v.squad === "FALCONS" || v.squad === "MAVERICK") ? "#ffcf33" : "#eef0f3",
        avatar: avatarCache[v.nome] || "",
      };
    })
    .sort((a, b) => b.pct - a.pct || a.nome.localeCompare(b.nome));
}

function barraHtml(item, idx, eixoMax) {
  const valorPct = item.pct * 100;
  const largura = Math.min(Math.max((valorPct / eixoMax) * 100, 4), 100);
  const valorDentro = largura >= 55;
  const pctTxt = valorPct.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%";
  const nomeEscapado = item.nome.replace(/'/g, "\\'");
  return `
    <div class="barra-row" onclick="alternarDetalhe(this, '${nomeEscapado}')">
      <div class="barra-rank">${idx + 1}º</div>
      <img class="barra-avatar" src="${item.avatar}" alt="">
      <div class="barra-corpo">
        <div class="barra-nome" style="color:${item.corNome}">${item.nome}</div>
        <div class="barra-area">
          <div class="barra-fill ${item.corBarra}" style="width:${largura}%">
            ${valorDentro ? `<span class="barra-valor-dentro">${pctTxt}</span>` : ""}
          </div>
          ${valorDentro ? "" : `<span class="barra-valor-fora" style="left:${largura}%; color:${item.corValor}">${pctTxt}</span>`}
        </div>
      </div>
    </div>
  `;
}

// Tamanho das linhas (avatar, fontes) sai da CSS var --linha-h, recalculada aqui a partir
// da altura real disponível ÷ número de vendedores — mesma ideia de antes (o raio do avatar
// era recalculado a partir do espaço por "raia"), só que em CSS puro agora.
function ajustarAlturaLinhas(el) {
  const linhas = el.querySelectorAll(".barra-row").length;
  if (!linhas) return;
  // Quando a trajetória de alguém está aberta, o painel dela também ocupa espaço dentro da
  // mesma lista — desconta a altura dele antes de dividir, senão as linhas ficam com o
  // avatar/fonte grandes demais pro espaço que sobrou de verdade.
  const painel = el.querySelector(".detalhe-trajetoria");
  const alturaPainel = painel ? painel.getBoundingClientRect().height : 0;
  const alturaLinha = (el.clientHeight - alturaPainel) / linhas;
  el.style.setProperty("--linha-h", Math.max(24, Math.min(64, alturaLinha)) + "px");
}
function recalcularTodasAsListas() {
  document.querySelectorAll(".barra-lista").forEach(ajustarAlturaLinhas);
}

function renderListaBarras(containerId, vendedores, eixoMax) {
  const el = document.getElementById(containerId);
  if (!vendedores.length) {
    el.innerHTML = '<div class="empty-msg">Sem dados no período.</div>';
    return;
  }
  const lista = prepararListaBarras(vendedores);
  el.innerHTML = lista.map((item, idx) => barraHtml(item, idx, eixoMax)).join("");
  ajustarAlturaLinhas(el);
  if (window.ResizeObserver) {
    new ResizeObserver(() => ajustarAlturaLinhas(el)).observe(el);
  }
}

// ===== Trajetória semanal: abre ao clicar numa barra, fecha ao clicar de novo (ou clicar
// em outra pessoa — só uma trajetória fica aberta por vez). Substitui o "clique isola a
// linha" do gráfico antigo pelo mesmo objetivo (ver a história de UM vendedor), só que
// agora num painel dedicado com o ponto de cada semana, como pedido. =====
let detalheAtual = null;
let chartDetalhe = null;

function fecharDetalhe() {
  const el = document.getElementById("detalheTrajetoria");
  if (el) el.remove();
  document.querySelectorAll(".barra-row.aberta").forEach(r => r.classList.remove("aberta"));
  if (chartDetalhe) { chartDetalhe.destroy(); chartDetalhe = null; }
  detalheAtual = null;
  recalcularTodasAsListas();
}

function alternarDetalhe(rowEl, nome) {
  const jaAberto = detalheAtual === nome;
  fecharDetalhe();
  if (jaAberto) return;
  rowEl.classList.add("aberta");
  detalheAtual = nome;

  const v = (ultimoDados || []).find(x => x.nome === nome);
  const pontos = v ? pontosSemanaisDe(v) : [];

  const painel = document.createElement("div");
  painel.className = "detalhe-trajetoria";
  painel.id = "detalheTrajetoria";
  painel.innerHTML = `
    <div class="detalhe-header">
      <span>Trajetória semanal — ${nome}</span>
      <button class="detalhe-fechar" onclick="event.stopPropagation(); fecharDetalhe();">✕</button>
    </div>
    <div class="detalhe-chart-wrap"><canvas id="canvasDetalhe"></canvas></div>
  `;
  rowEl.insertAdjacentElement("afterend", painel);
  recalcularTodasAsListas();

  if (!pontos.length) {
    painel.querySelector(".detalhe-chart-wrap").innerHTML = '<div class="empty-msg" style="padding:14px;">Sem pontos suficientes ainda.</div>';
    return;
  }

  const labels = pontos.map(p => formatarDataCurta(p.dia));
  const valores = pontos.map(p => +(p.pct * 100).toFixed(2));
  const maiorLocal = Math.max(...valores, 0);
  const maxLocal = maiorLocal < 100 ? 100 : Math.ceil(maiorLocal / 10) * 10 + 10;

  const ctx = document.getElementById("canvasDetalhe").getContext("2d");
  chartDetalhe = new Chart(ctx, {
    type: "line",
    data: {
      labels,
      datasets: [{
        data: valores,
        borderColor: "#ffcf33",
        backgroundColor: "#ffcf33",
        borderWidth: 2.5,
        tension: 0,
        pointRadius: 5,
        pointHoverRadius: 7,
        fill: false,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: (item) => item.parsed.y.toLocaleString("pt-BR", { minimumFractionDigits: 1 }) + "%" } },
      },
      scales: {
        x: { ticks: { color: corTextoSub(), font: { size: 11 } }, grid: { color: corGrid() } },
        y: { min: 0, max: maxLocal, ticks: { color: corTextoSub(), font: { size: 11 }, callback: (v) => v + "%" }, grid: { color: corGrid() } },
      },
    },
  });
}

// Calcula um único eixo de % (máximo + intervalo entre linhas) a partir de TODOS os
// vendedores dos dois gráficos juntos — garante que Closer e Gerentes de Contas fiquem na
// mesma escala, senão a régua visual de "mais à direita = número maior" quebra entre os
// dois cards.
// Regra: enquanto NINGUÉM bateu 100% da meta, o eixo fica fixo em 100% (não encolhe pra
// 70/80% só porque o líder ainda não chegou lá — a régua da meta batida sempre aparece no
// lugar certo). No momento em que alguém bate 100%, o eixo passa a se referenciar pelo 1º
// colocado (o maior % entre todos), com folga até a próxima marca de 10 pra caber o ponto
// dele por completo.
// IMPORTANTE: olha só o valor ATUAL (último dia com dado) de cada vendedor, não qualquer
// ponto histórico do mês — um valor fora da curva num dia já passado (ex.: sincronização
// zoada de um dia específico, corrigida depois) não pode esticar o eixo pra sempre só
// porque ficou registrado uma vez; o que importa é onde cada um está HOJE.
function calcularEixoPctCompartilhado(vendedoresGeral) {
  const valoresAtuais = vendedoresGeral
    .map(v => v.pontos.length ? v.pontos[v.pontos.length - 1].pct * 100 : 0);
  const maior = Math.max(...valoresAtuais, 0);
  if (maior < 100) {
    return { max: 100, step: 10 };
  }
  let max = Math.ceil(maior / 10) * 10;
  if (max <= maior) max += 10;
  let step = max > 200 ? 50 : 20;
  return { max, step };
}

async function render(dados) {
  ultimoDados = dados;
  document.getElementById("atualizadoLabel").textContent = "última leitura: " + new Date().toLocaleString("pt-BR");

  await garantirAvatares(dados);
  fecharDetalhe();

  const closerVend = dados.filter(v => CLOSER_SQUADS.includes(v.squad));
  const gcVend = dados.filter(v => GC_SQUADS.includes(v.squad));

  document.getElementById("conteudo").innerHTML = `
    <div class="pagina" data-pagina="0">
      <div class="card">
        <div class="card-titulo"> · Closer (Falcons + Stark)</div>
        <div class="barra-lista" id="listaCloser"></div>
      </div>
    </div>
    <div class="pagina" data-pagina="1">
      <div class="card">
        <div class="card-titulo"> · Gerentes de Contas (Maverick + Nexus)</div>
        <div class="barra-lista" id="listaGC"></div>
      </div>
    </div>
  `;

  const eixoPct = calcularEixoPctCompartilhado(dados);
  renderListaBarras("listaCloser", closerVend, eixoPct.max);
  renderListaBarras("listaGC", gcVend, eixoPct.max);

  mostrarPagina(paginaAtual);
  agendarProximaPagina();
}

// ===== Paginação por fade: 2 páginas (Closer / Gerentes de Contas) — cada card ocupa a
// página inteira (mais largura pra caber as fotos sem espremer), alternando sozinho como
// nos outros painéis. =====
const DURACAO_PAGINA_MS = 30000;
let paginaAtual = 0;
let direcaoPagina = 1;
let timerProximaPagina = null;
let paginacaoPausada = false;

function mostrarPagina(indice) {
  document.querySelectorAll("#conteudo .pagina").forEach((p, i) => p.classList.toggle("pagina-ativa", i === indice));
}
function agendarProximaPagina() {
  clearTimeout(timerProximaPagina);
  if (paginacaoPausada) return;
  timerProximaPagina = setTimeout(avancarPagina, DURACAO_PAGINA_MS);
}
// Botão de pausa ao lado das setas — pausa a troca automática de página (a navegação
// manual pelas setas continua funcionando normalmente, só não retoma a rotação sozinha).
function alternarPausa() {
  paginacaoPausada = !paginacaoPausada;
  const btn = document.getElementById("btnPausar");
  if (paginacaoPausada) {
    clearTimeout(timerProximaPagina);
    if (btn) { btn.textContent = "▶"; btn.title = "Retomar rotação"; btn.setAttribute("aria-label", "Retomar rotação"); }
  } else {
    if (btn) { btn.textContent = "⏸"; btn.title = "Pausar rotação"; btn.setAttribute("aria-label", "Pausar rotação"); }
    agendarProximaPagina();
  }
}
function avancarPagina() {
  const total = document.querySelectorAll("#conteudo .pagina").length;
  const ultimoIndice = total - 1;
  if (ultimoIndice <= 0) { agendarProximaPagina(); return; }
  if (paginaAtual + direcaoPagina > ultimoIndice || paginaAtual + direcaoPagina < 0) {
    direcaoPagina *= -1;
  }
  paginaAtual += direcaoPagina;
  mostrarPagina(paginaAtual);
  agendarProximaPagina();
}
function irPara(delta) {
  const total = document.querySelectorAll("#conteudo .pagina").length;
  const ultimoIndice = total - 1;
  if (ultimoIndice <= 0) return;
  let novoIndice = paginaAtual + delta;
  if (novoIndice > ultimoIndice) novoIndice = 0;
  if (novoIndice < 0) novoIndice = ultimoIndice;
  if (novoIndice === ultimoIndice) direcaoPagina = -1;
  else if (novoIndice === 0) direcaoPagina = 1;
  else direcaoPagina = delta >= 0 ? 1 : -1;
  paginaAtual = novoIndice;
  mostrarPagina(paginaAtual);
  agendarProximaPagina();
}

function jsonpRequest(url) {
  return new Promise((resolve, reject) => {
    const callbackName = "painelCallback_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
    const script = document.createElement("script");
    let timeoutId;
    function cleanup() {
      clearTimeout(timeoutId);
      delete window[callbackName];
      script.remove();
    }
    window[callbackName] = function(data) { resolve(data); cleanup(); };
    script.onerror = function() {
      reject(new Error("Falha ao carregar o Apps Script (verifique a URL/deploy)"));
      cleanup();
    };
    timeoutId = setTimeout(function() {
      reject(new Error("Tempo esgotado aguardando resposta do Apps Script"));
      cleanup();
    }, 25000);
    const sep = url.includes("?") ? "&" : "?";
    script.src = url + sep + "callback=" + callbackName + "&_=" + Date.now();
    document.body.appendChild(script);
  });
}

async function carregarDados() {
  try {
    const payload = await jsonpRequest(APPS_SCRIPT_URL + "&painel=individual-mensal");
    if (payload.error) throw new Error(payload.error);
    const dados = parseHistorico(payload);
    await render(dados);
  } catch (e) {
    if (!ultimoDados) {
      document.getElementById("conteudo").innerHTML = `
        <div class="card">
          <div class="empty-msg">
            Erro ao carregar dados: ${e.message || e}<br>
            Verifique se a aba "Histórico Individual Mensal" já existe e se o gatilho diário
            já rodou pelo menos uma vez (sem isso, ainda não há nenhum ponto pra desenhar).
          </div>
        </div>`;
    }
    console.error("Erro ao carregar painel individual mensal:", e);
    setTimeout(carregarDados, 30000);
  }
}

carregarDados();
setInterval(carregarDados, REFRESH_MS);
</script>
