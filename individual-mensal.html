<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel Individual Mensal — SeuBoné</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e1015;
    --card-bg: #171a21;
    --card-bg-2: #1d212b;
    --borda: #2a2f3a;
    --azul: #4f8cff;
    --dourado: #ffcf33;
    --cinza: #9aa1ac;
    --cinza-bg: #20242e;
    --verde: #3ddc97;
    --ambar: #fbbf24;
    --vermelho: #ff6b6b;
    --texto: #f3f4f6;
    --texto-sub: #9aa1ac;
    --grid-linha: rgba(255,255,255,0.06);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #dde0e5;
    --card-bg: #eceef1;
    --card-bg-2: #e4e7eb;
    --borda: #e4e6ea;
    --azul: #1e40af;
    --dourado: #b8860b;
    --cinza: #6b7280;
    --cinza-bg: #d7dbe1;
    --verde: #16a34a;
    --ambar: #d97706;
    --vermelho: #dc2626;
    --texto: #111827;
    --texto-sub: #6b7280;
    --grid-linha: rgba(0,0,0,0.08);
  }
  body { transition: background-color .25s ease, color .25s ease; }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--texto);
    padding: 10px 24px 12px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .header { flex: none; display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:6px; flex-wrap:wrap; gap:10px; }
  .header .logo { height: 28px; width:auto; display:block; margin-bottom:2px; }
  :root[data-theme="light"] .header .logo { filter: brightness(0); }
  .header .brand-sub { font-size:11px; font-weight:700; letter-spacing:.1em; color:var(--texto-sub); text-transform:uppercase; }
  .header .semana { font-size:18px; font-weight:800; margin-top:1px; }
  .header .meta-info { text-align:right; font-size:12px; color:var(--texto-sub); }
  .link-outro-painel { display:block; margin-top:2px; font-size:12px; color:var(--texto-sub); text-decoration:none; }
  .link-outro-painel:hover { color:var(--dourado); }
  .theme-toggle {
    margin-top: 4px; border: 1px solid var(--borda); background: var(--card-bg); color: var(--texto);
    font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 999px; cursor: pointer;
  }
  .theme-toggle:hover { border-color: var(--dourado); }
  #conteudo { position:relative; flex:1 1 auto; min-height:0; overflow:hidden; }
  .pagina {
    position:absolute; inset:0; overflow:hidden;
    opacity:0; visibility:hidden;
    transition: opacity .7s ease;
    display:flex;
  }
  .pagina.pagina-ativa { opacity:1; visibility:visible; }
  .card { background:var(--card-bg); border:1px solid var(--borda); border-radius:18px; padding:10px 20px 6px; width:100%; min-width:0; min-height:0; display:flex; flex-direction:column; }
  .card-titulo { font-weight:800; font-style:italic; text-transform:uppercase; font-size:15px; margin-bottom:4px; letter-spacing:.02em; flex:none; }
  .chart-wrap { position:relative; flex:1 1 auto; min-height:0; }
  .empty-msg { padding:44px; text-align:center; color:var(--texto-sub); }
  .pagina-nav { position:fixed; right:10px; bottom:6px; display:flex; gap:4px; z-index:50; opacity:.3; transition:opacity .2s ease; }
  .pagina-nav:hover { opacity:1; }
  .pagina-nav-btn { width:18px; height:18px; border-radius:50%; border:1px solid var(--borda); background:var(--card-bg); color:var(--texto-sub); font-size:11px; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
  .pagina-nav-btn:hover { border-color:var(--dourado); color:var(--dourado); }
</style>
</head>
<body>

  <div class="header">
    <div>
      <img class="logo" src="logo.png" alt="SeuBoné">
      <div class="brand-sub">Painel Comercial · Individual Mensal</div>
      <div class="semana" id="semanaLabel">Corrida individual</div>
    </div>
    <div class="meta-info">
      <div id="atualizadoLabel">última leitura: —</div>
      <button class="theme-toggle" id="btnTema" onclick="alternarTema()">☀️ Tema claro</button>
      <a class="link-outro-painel" href="index.html">← Painel de vendedores</a>
      <a class="link-outro-painel" href="squads.html">← Painel de squads</a>
    </div>
  </div>

  <div id="conteudo">
    <div class="pagina pagina-ativa">
      <div class="card">
        <div class="empty-msg">Carregando dados da planilha…</div>
      </div>
    </div>
  </div>

  <div class="pagina-nav">
    <button class="pagina-nav-btn" onclick="irPara(-1)" aria-label="Página anterior" title="Página anterior">‹</button>
    <button class="pagina-nav-btn" onclick="irPara(1)" aria-label="Próxima página" title="Próxima página">›</button>
  </div>

<script>
// >>> URL do Apps Script (doGet) — mesma URL dos outros 2 painéis <<<
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx_8R_UGyyXDK68tazvTc9wj0-ECxbtCvHHOXArkAtvtTjX5uoe2kVCtnG2uxlkfkMxkA/exec?key=comercialpainel2026";

const REFRESH_MS = 10 * 60 * 1000; // 10 min
const CLOSER_SQUADS = ["FALCONS", "STARK"];
const GC_SQUADS = ["MAVERICK", "NEXUS"];

let chartCloser = null;
let chartGC = null;
let ultimoDados = null;
const avatarCache = {}; // nome -> canvas circular (ou null se não achou foto)

function toNum(v) {
  if (typeof v === "number") return v;
  const n = parseFloat(String(v || "").replace(",", "."));
  return isNaN(n) ? 0 : n;
}
function getInitials(nome) {
  return String(nome || "").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();
}
function slugFoto(nome) {
  return String(nome || "")
    .toUpperCase()
    .normalize("NFD")
    .replace(/[̀-ͯ]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");
}
const EXT_FOTOS = ["jpg", "jpeg", "png", "webp"];

// Tenta carregar a foto do vendedor (cascata de extensões); se nenhuma existir, devolve null
// (o ponto do gráfico cai pra um círculo simples com as iniciais, sem quebrar nada).
function preloadFoto(nome) {
  return new Promise((resolve) => {
    const slug = slugFoto(nome);
    let i = 0;
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = () => {
      i++;
      if (i < EXT_FOTOS.length) { img.src = "fotos/" + slug + "." + EXT_FOTOS[i]; }
      else resolve(null);
    };
    img.src = "fotos/" + slug + "." + EXT_FOTOS[0];
  });
}
// Recorta a foto num círculo com borda dourada — vira o "ponto atual" do vendedor no gráfico.
function avatarCircular(img, nome, size) {
  const canvas = document.createElement("canvas");
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext("2d");
  ctx.save();
  ctx.beginPath();
  ctx.arc(size / 2, size / 2, size / 2 - 2, 0, Math.PI * 2);
  ctx.closePath();
  ctx.clip();
  if (img) {
    ctx.drawImage(img, 0, 0, size, size);
  } else {
    ctx.fillStyle = "#20242e";
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = "#f3f4f6";
    ctx.font = "bold " + Math.round(size * 0.32) + "px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(getInitials(nome), size / 2, size / 2 + 1);
  }
  ctx.restore();
  ctx.beginPath();
  ctx.arc(size / 2, size / 2, size / 2 - 2, 0, Math.PI * 2);
  ctx.lineWidth = 4;
  ctx.strokeStyle = "#ffcf33";
  ctx.stroke();
  return canvas;
}

function aplicarTema(tema) {
  document.documentElement.setAttribute("data-theme", tema);
  const btn = document.getElementById("btnTema");
  if (btn) btn.textContent = tema === "dark" ? "☀️ Tema claro" : "🌙 Tema escuro";
  try { localStorage.setItem("painelIndividualMensalTema", tema); } catch (e) {}
  if (ultimoDados) render(ultimoDados);
}
function alternarTema() {
  const atual = document.documentElement.getAttribute("data-theme") || "dark";
  aplicarTema(atual === "dark" ? "light" : "dark");
}
(function iniciarTema() {
  let salvo = "dark";
  try { salvo = localStorage.getItem("painelIndividualMensalTema") || "dark"; } catch (e) {}
  document.documentElement.setAttribute("data-theme", salvo);
})();
(function sincronizarBotaoTema() {
  const tema = document.documentElement.getAttribute("data-theme") || "dark";
  const btn = document.getElementById("btnTema");
  if (btn) btn.textContent = tema === "dark" ? "☀️ Tema claro" : "🌙 Tema escuro";
})();

function corTexto() { return getComputedStyle(document.documentElement).getPropertyValue("--texto").trim(); }
function corTextoSub() { return getComputedStyle(document.documentElement).getPropertyValue("--texto-sub").trim(); }
function corGrid() { return getComputedStyle(document.documentElement).getPropertyValue("--grid-linha").trim(); }

// Extrai o dia (1-31) de uma string de data "yyyy-MM-dd" (ou ISO completo) sem usar o
// construtor Date — evita o fuso horário deslocar o dia (Sheets grava em UTC).
function extrairDia(dataStr) {
  const m = String(dataStr || "").match(/(\d{4})-(\d{2})-(\d{2})/);
  return m ? parseInt(m[3], 10) : 0;
}

function diasNoMesAtual() {
  const hoje = new Date();
  return new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0).getDate();
}

const MESES_PT = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
function preencherLabelMes() {
  const hoje = new Date();
  const label = document.getElementById("semanaLabel");
  if (label) label.textContent = "Corrida Individual — " + MESES_PT[hoje.getMonth()] + "/" + hoje.getFullYear();
}
preencherLabelMes();

// Vendedores fora do painel (mesma exclusão do painel 1).
const EXCLUDE_VENDEDORES = ["HADYJA SARAIVA", "P MARANHAO", "P MARANHÃO"];

// Linha 0 da planilha de histórico é o cabeçalho ["Data","Vendedor","Squad","Resultado"].
function parseHistorico(payload) {
  const rows = (payload.rows || []).slice(1).filter(r => r[0] && r[1]);
  const porVendedor = {};
  rows.forEach(r => {
    const dia = extrairDia(r[0]);
    const nome = String(r[1]).trim();
    const squad = String(r[2] || "").trim().toUpperCase();
    const pct = toNum(r[3]);
    if (!dia || !nome) return;
    if (EXCLUDE_VENDEDORES.includes(nome.toUpperCase())) return;
    if (!porVendedor[nome]) porVendedor[nome] = { nome, squad, pontos: [] };
    porVendedor[nome].pontos.push({ dia, pct });
  });
  const lista = Object.values(porVendedor);
  lista.forEach(v => v.pontos.sort((a, b) => a.dia - b.dia));
  return lista;
}

// Cor do % pela PROJEÇÃO de fechamento do mês (não pelo % acumulado até hoje).
// Ex.: dia 17 de um mês de 31 dias, 77,4% acumulado → ritmo projeta 77,4% * (31/17) = 141% →
// verde, porque no ritmo atual o vendedor fecha acima da meta.
function corPorProjecao(projecao) {
  if (projecao >= 1) return "#3ddc97";
  if (projecao >= 0.7) return "#fbbf24";
  return "#ff6b6b";
}
function projetarFechamento(pctAtual, diaAtual, diasNoMes) {
  if (!diaAtual) return pctAtual;
  return pctAtual * (diasNoMes / diaAtual);
}

async function garantirAvatares(vendedores) {
  await Promise.all(vendedores.map(async v => {
    if (!(v.nome in avatarCache)) {
      const img = await preloadFoto(v.nome);
      avatarCache[v.nome] = avatarCircular(img, v.nome, 96);
    }
  }));
}

// Raio "ideal" do avatar quando o vendedor está isolado (ninguém perto dele em % e dia) —
// e o raio mínimo que ele pode encolher até, quando o % dele está muito colado no de
// outro vendedor. A posição (dia + %) nunca muda: só o TAMANHO da foto se adapta pra
// nunca sobrepor a foto vizinha — regra do Felipe: número e altura no gráfico não podem
// discordar nunca.
const RAIO_AVATAR_MAX = 19;
const RAIO_AVATAR_MIN = 6;

function montarDatasets(vendedores) {
  const diasTotais = diasNoMesAtual();
  return vendedores.map((v, i) => {
    const hue = (i * 61) % 360; // espaça as cores pra não repetir tons parecidos em sequência
    const cor = "hsl(" + hue + ", 68%, 56%)";
    const n = v.pontos.length;
    const avatar = avatarCache[v.nome];
    const pctAtual = v.pontos[n - 1].pct;
    const diaAtual = v.pontos[n - 1].dia;
    const projecao = projetarFechamento(pctAtual, diaAtual, diasTotais);
    return {
      label: v.nome,
      data: v.pontos.map(p => ({ x: p.dia, y: +(p.pct * 100).toFixed(2) })),
      borderColor: cor,
      backgroundColor: cor,
      borderWidth: 2.5,
      tension: 0,
      fill: false,
      // O ponto atual (índice n-1) não é mais desenhado pelo Chart.js — o plugin
      // avatarDeclutterPlugin desenha a foto dele à parte, deslocada o mínimo
      // necessário pra não empilhar em cima de outra foto com % parecido.
      pointStyle: "circle",
      pointRadius: v.pontos.map((p, idx) => idx === n - 1 ? 0 : 4),
      pointHoverRadius: v.pontos.map((p, idx) => idx === n - 1 ? 0 : 6),
      _avatarImg: avatar,
      _corPct: corPorProjecao(projecao),
      _pctTexto: (pctAtual * 100).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%",
    };
  });
}

// Desenha, por cima do gráfico, a foto do ponto atual de cada vendedor + o % colorido —
// SEMPRE exatamente no dia e no % reais (sem mover em nenhum eixo, em nenhuma hipótese).
// Quando duas fotos ficam muito próximas, quem resolve não é a posição — é o TAMANHO:
// cada foto encolhe o mínimo necessário pra não tocar a vizinha mais próxima (com um raio
// mínimo de segurança). Se dois vendedores estiverem com % literalmente idêntico, as fotos
// vão se tocar mesmo assim — é o limite físico de manter a posição 100% fiel ao dado.
const avatarDeclutterPlugin = {
  id: "avatarDeclutter",
  afterDatasetsDraw(chart) {
    const { ctx } = chart;
    const itens = [];
    chart.data.datasets.forEach((ds, dsIndex) => {
      const meta = chart.getDatasetMeta(dsIndex);
      if (meta.hidden || !ds.data.length) return;
      const ultimoIdx = ds.data.length - 1;
      const ponto = meta.data[ultimoIdx];
      if (!ponto) return;
      itens.push({ x: ponto.x, y: ponto.y, avatar: ds._avatarImg, cor: ds._corPct, texto: ds._pctTexto });
    });
    if (!itens.length) return;

    // Pra cada foto, o raio máximo que ela pode ter sem tocar a foto mais próxima (em
    // qualquer direção — dia ou %) é metade da distância real até essa vizinha, com uma
    // pequena margem de segurança de 2px.
    itens.forEach((it, i) => {
      let menorDist = Infinity;
      itens.forEach((outro, j) => {
        if (i === j) return;
        const d = Math.hypot(it.x - outro.x, it.y - outro.y);
        if (d < menorDist) menorDist = d;
      });
      const raioSeguro = isFinite(menorDist) ? (menorDist / 2 - 2) : RAIO_AVATAR_MAX;
      it.raio = Math.max(RAIO_AVATAR_MIN, Math.min(RAIO_AVATAR_MAX, raioSeguro));
      it.fonte = Math.round(Math.max(9, Math.min(14, it.raio + 3)));
    });

    itens.forEach(it => {
      if (it.avatar) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(it.x, it.y, it.raio, 0, Math.PI * 2);
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(it.avatar, it.x - it.raio, it.y - it.raio, it.raio * 2, it.raio * 2);
        ctx.restore();
      }
      ctx.save();
      ctx.font = "bold " + it.fonte + "px sans-serif";
      ctx.fillStyle = it.cor;
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText(it.texto, it.x + it.raio + 6, it.y);
      ctx.restore();
    });
  }
};
Chart.register(avatarDeclutterPlugin);

// Calcula um único eixo Y (máximo + intervalo entre linhas) a partir de TODOS os vendedores
// dos dois gráficos juntos — garante que Closer e Gerentes de Contas fiquem na mesma escala,
// senão a régua visual de "barra maior = número maior" quebra entre os dois cards.
function calcularEixoYCompartilhado(vendedoresGeral) {
  const maior = Math.max(...vendedoresGeral.flatMap(v => v.pontos.map(p => p.pct * 100)), 10);
  let max = Math.ceil((maior * 1.2) / 10) * 10;
  if (max < 20) max = 20;
  let step = 10;
  if (max > 100) step = 20;
  if (max > 200) step = 50;
  return { max, step };
}

function desenharCorrida(canvasId, chartRefSetter, chartRefAtual, vendedores, eixoY) {
  const wrap = document.getElementById(canvasId).closest(".chart-wrap");
  if (!vendedores.length) {
    wrap.innerHTML = '<div class="empty-msg">Sem dados no período.</div>';
    return;
  }
  if (chartRefAtual) chartRefAtual.destroy();
  const ctx = document.getElementById(canvasId).getContext("2d");
  const datasets = montarDatasets(vendedores);
  const chart = new Chart(ctx, {
    type: "line",
    data: { datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { top: 30, right: 90, bottom: 10, left: 6 } },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: (items) => items[0]?.dataset.label || "",
            label: (item) => "Dia " + item.parsed.x + " · " + item.parsed.y.toLocaleString("pt-BR", { minimumFractionDigits: 1 }) + "%"
          }
        }
      },
      scales: {
        x: {
          type: "linear",
          min: 1,
          max: diasNoMesAtual(),
          title: { display: true, text: "Dia do mês", color: corTextoSub(), font: { size: 13, weight: "700" } },
          // Só o RÓTULO do eixo pula de 5 em 5 dias (menos poluição visual) — os pontos
          // da trilha continuam existindo em TODOS os dias, e passar o mouse em qualquer
          // um mostra o dia exato e o % daquele dia (ver tooltip acima).
          ticks: { color: corTextoSub(), stepSize: 5, precision: 0, autoSkip: false, font: { size: 10 } },
          grid: { color: corGrid() }
        },
        y: {
          beginAtZero: true,
          min: 0,
          max: eixoY.max,
          title: { display: true, text: "% da meta mensal", color: corTextoSub(), font: { size: 13, weight: "700" } },
          ticks: { color: corTextoSub(), stepSize: eixoY.step, callback: (v) => v + "%" },
          grid: { color: corGrid() }
        }
      }
    }
  });
  chartRefSetter(chart);
}

async function render(dados) {
  ultimoDados = dados;
  document.getElementById("atualizadoLabel").textContent = "última leitura: " + new Date().toLocaleString("pt-BR");

  await garantirAvatares(dados);

  const closerVend = dados.filter(v => CLOSER_SQUADS.includes(v.squad));
  const gcVend = dados.filter(v => GC_SQUADS.includes(v.squad));

  document.getElementById("conteudo").innerHTML = `
    <div class="pagina" data-pagina="0">
      <div class="card">
        <div class="card-titulo">Corrida Individual Mensal · Closer (Falcons + Stark)</div>
        <div class="chart-wrap"><canvas id="chartCloser"></canvas></div>
      </div>
    </div>
    <div class="pagina" data-pagina="1">
      <div class="card">
        <div class="card-titulo">Corrida Individual Mensal · Gerentes de Contas (Maverick + Nexus)</div>
        <div class="chart-wrap"><canvas id="chartGC"></canvas></div>
      </div>
    </div>
  `;

  const eixoY = calcularEixoYCompartilhado(dados);
  desenharCorrida("chartCloser", (c) => { chartCloser = c; }, chartCloser, closerVend, eixoY);
  desenharCorrida("chartGC", (c) => { chartGC = c; }, chartGC, gcVend, eixoY);

  mostrarPagina(paginaAtual);
  agendarProximaPagina();
}

// ===== Paginação por fade: 2 páginas (Closer / Gerentes de Contas) — cada card ocupa a
// página inteira (mais largura pra caber as fotos sem espremer), alternando sozinho como
// nos outros painéis. =====
const DURACAO_PAGINA_MS = 20000;
let paginaAtual = 0;
let direcaoPagina = 1;
let timerProximaPagina = null;

function mostrarPagina(indice) {
  document.querySelectorAll("#conteudo .pagina").forEach((p, i) => p.classList.toggle("pagina-ativa", i === indice));
}
function agendarProximaPagina() {
  clearTimeout(timerProximaPagina);
  timerProximaPagina = setTimeout(avancarPagina, DURACAO_PAGINA_MS);
}
function avancarPagina() {
  const total = document.querySelectorAll("#conteudo .pagina").length;
  const ultimoIndice = total - 1;
  if (ultimoIndice <= 0) { agendarProximaPagina(); return; }
  if (paginaAtual + direcaoPagina > ultimoIndice || paginaAtual + direcaoPagina < 0) {
    direcaoPagina *= -1;
  }
  paginaAtual += direcaoPagina;
  mostrarPagina(paginaAtual);
  agendarProximaPagina();
}
function irPara(delta) {
  const total = document.querySelectorAll("#conteudo .pagina").length;
  const ultimoIndice = total - 1;
  if (ultimoIndice <= 0) return;
  let novoIndice = paginaAtual + delta;
  if (novoIndice > ultimoIndice) novoIndice = 0;
  if (novoIndice < 0) novoIndice = ultimoIndice;
  if (novoIndice === ultimoIndice) direcaoPagina = -1;
  else if (novoIndice === 0) direcaoPagina = 1;
  else direcaoPagina = delta >= 0 ? 1 : -1;
  paginaAtual = novoIndice;
  mostrarPagina(paginaAtual);
  agendarProximaPagina();
}

function jsonpRequest(url) {
  return new Promise((resolve, reject) => {
    const callbackName = "painelCallback_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
    const script = document.createElement("script");
    let timeoutId;
    function cleanup() {
      clearTimeout(timeoutId);
      delete window[callbackName];
      script.remove();
    }
    window[callbackName] = function(data) { resolve(data); cleanup(); };
    script.onerror = function() {
      reject(new Error("Falha ao carregar o Apps Script (verifique a URL/deploy)"));
      cleanup();
    };
    timeoutId = setTimeout(function() {
      reject(new Error("Tempo esgotado aguardando resposta do Apps Script"));
      cleanup();
    }, 25000);
    const sep = url.includes("?") ? "&" : "?";
    script.src = url + sep + "callback=" + callbackName + "&_=" + Date.now();
    document.body.appendChild(script);
  });
}

async function carregarDados() {
  try {
    const payload = await jsonpRequest(APPS_SCRIPT_URL + "&painel=individual-mensal");
    if (payload.error) throw new Error(payload.error);
    const dados = parseHistorico(payload);
    await render(dados);
  } catch (e) {
    if (!ultimoDados) {
      document.getElementById("conteudo").innerHTML = `
        <div class="card">
          <div class="empty-msg">
            Erro ao carregar dados: ${e.message || e}<br>
            Verifique se a aba "Histórico Individual Mensal" já existe e se o gatilho diário
            já rodou pelo menos uma vez (sem isso, ainda não há nenhum ponto pra desenhar).
          </div>
        </div>`;
    }
    console.error("Erro ao carregar painel individual mensal:", e);
    setTimeout(carregarDados, 30000);
  }
}

carregarDados();
setInterval(carregarDados, REFRESH_MS);
