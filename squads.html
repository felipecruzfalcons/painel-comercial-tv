<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel Squads — SeuBoné</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e1015;
    --card-bg: #171a21;
    --card-bg-2: #1d212b;
    --borda: #2a2f3a;
    --azul: #4f8cff;
    --azul-bg: rgba(79,140,255,0.14);
    --dourado: #ffcf33;
    --dourado-bg: rgba(255,207,51,0.14);
    --cinza: #9aa1ac;
    --cinza-bg: #20242e;
    --verde: #3ddc97;
    --verde-bg: rgba(61,220,151,0.14);
    --ambar: #fbbf24;
    --ambar-bg: rgba(251,191,36,0.14);
    --vermelho: #ff6b6b;
    --vermelho-bg: rgba(255,107,107,0.14);
    --texto: #f3f4f6;
    --texto-sub: #9aa1ac;
    --grid-linha: rgba(255,255,255,0.06);
    --destaque-vivo: #ffd400;
    --dourado-bg-leve: rgba(255,207,51,0.07);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #dde0e5;
    --card-bg: #eceef1;
    --card-bg-2: #e4e7eb;
    --borda: #e4e6ea;
    --azul: #1e40af;
    --azul-bg: #eaf1ff;
    --dourado: #b8860b;
    --dourado-bg: #fff7e0;
    --cinza: #6b7280;
    --cinza-bg: #d7dbe1;
    --verde: #16a34a;
    --verde-bg: #ecfdf3;
    --ambar: #d97706;
    --ambar-bg: #fff8ec;
    --vermelho: #dc2626;
    --vermelho-bg: #fef2f2;
    --texto: #111827;
    --texto-sub: #6b7280;
    --grid-linha: rgba(0,0,0,0.08);
    --destaque-vivo: #ffd400;
    --dourado-bg-leve: #fffaf0;
  }
  body { transition: background-color .25s ease, color .25s ease; }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--texto);
    padding: 22px 32px 32px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .header { position:relative; flex: none; display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:18px; flex-wrap:wrap; gap:10px; }
  .header .logo { height: 42px; width:auto; display:block; margin-bottom:6px; }
  /* Página mensal: o rótulo "MENSAL setembro/2026" sai do fluxo normal (fica embaixo do
     logo, alinhado à esquerda) e vai pro centro do cabeçalho, bem maior — pedido do
     Felipe pra dar mais destaque ao mês corrente. Só nessa página; a semanal continua
     como sempre foi. */
  .header .semana.semana--mensal {
    position:absolute; left:50%; top:50%; transform:translate(-50%, -50%);
    font-size:58px; text-align:center; white-space:nowrap;
  }
  /* Tema claro: logo vira preto sólido — no escuro fica como é. */
  :root[data-theme="light"] .header .logo {
    filter: brightness(0);
  }
  .header .brand-sub { font-size:13px; font-weight:700; letter-spacing:.1em; color:var(--texto-sub); text-transform:uppercase; }
  .header .semana { font-size:26px; font-weight:800; margin-top:2px; }
  .header .meta-info { text-align:right; font-size:14px; color:var(--texto-sub); }
  #conteudo { position:relative; flex:1 1 auto; min-height:0; overflow:hidden; }
  .pagina {
    position:absolute; inset:0; overflow:hidden;
    opacity:0; visibility:hidden;
    transition: opacity .7s ease;
    display:flex; flex-direction:column; justify-content:center;
  }
  .pagina.pagina-ativa { opacity:1; visibility:visible; }
  .pagina > .grid { width:100%; flex-shrink:0; }
  .grid { display:grid; grid-template-columns: repeat(12, 1fr); gap:16px; }
  .card { background:var(--card-bg); border:1px solid var(--borda); border-radius:18px; padding:20px 24px; }
  .card-label { font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--texto-sub); margin-bottom:10px; display:flex; align-items:center; gap:7px; }
  .hero { grid-column: span 12; padding:28px 32px; }
  .hero-top { display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:18px; }
  .hero-num { font-size:76px; font-weight:800; line-height:1; }
  .hero-sub { font-size:18px; color:var(--texto-sub); margin-top:8px; }
  .hero-sub--destaque { font-size:26px; font-weight:800; color:var(--texto); margin-top:10px; }
  .bar-wrap { position:relative; margin-top:22px; height:26px; background:var(--cinza-bg); border:1px solid var(--borda); border-radius:999px; overflow:visible; }
  .bar-fill { position:absolute; left:0; top:0; height:100%; border-radius:999px; transition:width .6s ease; }
  .bar-marker { position:absolute; top:-7px; bottom:-7px; width:3px; background:var(--dourado); }
  .bar-marker-label { position:absolute; top:-28px; transform:translateX(-50%); font-size:13px; font-weight:700; color:var(--dourado); white-space:nowrap; }
  .bar-marker-label--alt { top:-48px; }
  .bar-legend { display:flex; justify-content:space-between; margin-top:10px; font-size:13px; color:var(--texto-sub); }
  .ladder { grid-column: span 12; }
  .ladder-row { display:flex; gap:14px; overflow-x:auto; padding-bottom:4px; }
  .chip { flex:1 1 0; min-width:150px; border-radius:16px; padding:28px 22px; text-align:center; border:1px solid var(--borda); background:var(--cinza-bg); }
  .chip.proximo { background:var(--dourado-bg); border-color:var(--dourado); }
  .chip .tier { font-size:20px; font-weight:700; color:var(--texto-sub); }
  .chip.proximo .tier { color:var(--dourado); }
  .chip .valor { font-size:36px; font-weight:800; margin-top:10px; }
  .rank-card { grid-column: span 12; position:relative; }
  .rank-card--destaque {
    border: 3px solid var(--destaque-vivo);
    box-shadow: inset 0 0 0 2px #000, 0 14px 34px rgba(0,0,0,0.28);
    padding: 16px 22px;
  }
  .rank-card .card-label .dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
  .dot-azul { background:var(--azul); }
  .dot-dourado { background:var(--dourado); }
  .group-total { display:flex; align-items:baseline; gap:10px; margin-bottom:16px; padding-bottom:14px; border-bottom:1px dashed var(--borda); }
  .group-total .pct { font-size:34px; font-weight:800; }
  .group-total .desc { font-size:13px; color:var(--texto-sub); }
  .podium-row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--borda); }
  .podium-row:last-child { border-bottom:none; }
  .medal { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; color:#161616; flex-shrink:0; }
  .medal-1 { background:#e9c542; }
  .medal-2 { background:#b7bec8; }
  .avatar { position:relative; overflow:hidden; width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; color:#101114; flex-shrink:0; }
  .avatar-azul { background: linear-gradient(135deg, var(--azul), #9cc0ff); }
  .avatar-dourado { background: linear-gradient(135deg, var(--dourado), #ffe38a); }
  .p-nome { font-weight:700; font-size:15px; }
  .p-squad { font-size:12px; color:var(--texto-sub); }
  .p-right { margin-left:auto; text-align:right; }
  .p-pct { font-weight:800; font-size:20px; }
  .footer { grid-column: span 12; font-size:12px; color:var(--texto-sub); text-align:center; margin-top:6px; }
  .empty-msg { padding:44px; text-align:center; color:var(--texto-sub); }
  .theme-toggle {
    margin-top: 8px;
    border: 1px solid var(--borda);
    background: var(--card-bg);
    color: var(--texto);
    font-size: 13px;
    font-weight: 700;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
  }
  .theme-toggle:hover { border-color: var(--dourado); }

  /* ===== "Corrida" — barra 3D grande, estilo gráfico de squads (referência do Felipe).
     Tamanhos aumentados (era bem menor que o card, sobrava muito vazio) pra ler de longe. */
  .corrida-titulo { font-weight:800; font-style:italic; text-transform:uppercase; text-align:center; font-size:26px; margin-bottom:20px; letter-spacing:.02em; }
  .corrida-row { display:flex; align-items:center; gap:20px; margin-bottom:26px; }
  .corrida-row:last-child { margin-bottom:10px; }
  .corrida-logo-wrap { display:flex; flex-direction:column; align-items:center; gap:6px; flex-shrink:0; width:140px; }
  .corrida-logo { position:relative; overflow:hidden; width:140px; height:140px; border-radius:20px; background:var(--cinza-bg); color:var(--texto); font-weight:800; font-size:24px; display:flex; align-items:center; justify-content:center; box-shadow:0 7px 16px rgba(0,0,0,.35); flex-shrink:0; }
  .corrida-logo img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .corrida-posicao { font-weight:800; font-size:18px; color:var(--texto-sub); }
  .corrida-bar-area { position:relative; flex:1 1 auto; min-width:0; height:100px; }
  .corrida-bar {
    position:relative; height:100%; min-width:6%;
    border-radius:16px 6px 6px 16px;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-style:italic; font-size:27px; color:#1a1a1a;
    box-shadow: 0 8px 0 rgba(0,0,0,.2), 0 12px 18px rgba(0,0,0,.3);
    transition: width .6s ease;
  }
  .corrida-bar::after {
    content:""; position:absolute; top:3px; bottom:-8px; right:-16px; width:22px;
    background: linear-gradient(120deg, rgba(0,0,0,.18), rgba(0,0,0,.42));
    clip-path: polygon(0 0, 100% 22%, 100% 100%, 0 78%);
  }
  .corrida-bar.cor-1 { background: linear-gradient(180deg, #6dffb3 0%, #00e676 45%, #009e56 100%); }
  .corrida-bar.cor-2 { background: linear-gradient(180deg, #ffe066 0%, #ffb300 45%, #c77800 100%); }
  .corrida-bar-nome { text-shadow: 0 1px 0 rgba(255,255,255,.25); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:92%; }
  /* Valor fora da barra (barras curtas, sobra espaço no card à direita) */
  .corrida-bar-valor { position:absolute; top:50%; transform:translateY(-50%); margin-left:calc(18px + 1cm); font-weight:800; font-size:38px; white-space:nowrap; }
  /* Valor DENTRO da barra (barras compridas — perto ou no máximo do eixo): sem isso o
     número ficava posicionado além da borda do card e sumia (ex.: líder disparado). */
  .corrida-bar-valor-dentro { position:absolute; right:22px; top:50%; transform:translateY(-50%); font-weight:800; font-style:italic; font-size:27px; color:#1a1a1a; text-shadow:0 1px 0 rgba(255,255,255,.35); white-space:nowrap; }
  .corrida-eixo { display:flex; justify-content:space-between; margin-top:8px; font-size:16px; color:var(--texto-sub); }
  .corrida-eixo-wrap { margin-left:160px; }
  .link-outro-painel {
    margin-top: 8px;
    display: inline-block;
    font-size: 13px;
    color: var(--texto-sub);
    text-decoration: none;
    border: 1px solid var(--borda);
    padding: 7px 14px;
    border-radius: 999px;
  }
  .link-outro-painel:hover { border-color: var(--azul); color: var(--azul); }
  .pagina-nav { position:fixed; right:10px; bottom:6px; display:flex; gap:4px; z-index:50; opacity:.3; transition:opacity .2s ease; }
  .pagina-nav:hover { opacity:1; }
  .pagina-nav-btn { width:18px; height:18px; border-radius:50%; border:1px solid var(--borda); background:var(--card-bg); color:var(--texto-sub); font-size:11px; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
  .pagina-nav-btn:hover { border-color:var(--dourado); color:var(--dourado); }
</style>
</head>
<body>

  <div class="header">
    <div>
      <img class="logo" src="logo.png" alt="SeuBoné">
      <div class="semana" id="semanaLabel">carregando…</div>
    </div>
    <div class="meta-info">
      <div id="atualizadoLabel">última leitura: —</div>
      <button class="theme-toggle" id="btnTema" onclick="alternarTema()">☀️ Tema claro</button>
      <br>
      <a class="link-outro-painel" href="index.html">← Painel de vendedores</a>
    </div>
  </div>

  <div id="conteudo">
    <div class="pagina pagina-ativa">
      <div class="grid">
        <div class="empty-msg" style="grid-column: span 12;">Carregando dados da planilha…</div>
      </div>
    </div>
  </div>

  <div class="pagina-nav">
    <button class="pagina-nav-btn" onclick="irPara(-1)" aria-label="Página anterior" title="Página anterior">‹</button>
    <button class="pagina-nav-btn" id="btnPausar" onclick="alternarPausa()" aria-label="Pausar passagem de página" title="Pausar passagem de página">⏸</button>
    <button class="pagina-nav-btn" onclick="irPara(1)" aria-label="Próxima página" title="Próxima página">›</button>
  </div>

<script>
// >>> Mesma URL/deploy do Apps Script do painel de vendedores — só troca o parâmetro
// "painel=squads" pra ler a aba de resultado semanal/mensal dos squads em vez da aba
// de vendedores. Sem "painel=squads" continua servindo a aba de vendedores de sempre. <<<
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx_8R_UGyyXDK68tazvTc9wj0-ECxbtCvHHOXArkAtvtTjX5uoe2kVCtnG2uxlkfkMxkA/exec?key=comercialpainel2026";

const REFRESH_MS = 10 * 60 * 1000; // 10 min
const CLOSER_SQUADS = ["FALCONS", "STARK"];
const GC_SQUADS = ["MAVERICK", "NEXUS"];
const EXCLUDE_SQUADS = ["TUBA", "SUPERNOVA", "BIGBANG", ""];

function fmtBRL(v) {
  return "R$ " + Number(v || 0).toLocaleString("pt-BR", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}
function fmtPct(v) {
  return (Number(v || 0) * 100).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%";
}
function toNum(v) {
  if (typeof v === "number") return v;
  const n = parseFloat(String(v || "").replace(",", "."));
  return isNaN(n) ? 0 : n;
}

function statusFromRatio(ratio) {
  if (ratio >= 0.95) return "verde";
  if (ratio >= 0.7) return "ambar";
  return "vermelho";
}

// ===== Tema claro/escuro =====
let ultimoDados = null;

function aplicarTema(tema) {
  document.documentElement.setAttribute("data-theme", tema);
  const btn = document.getElementById("btnTema");
  if (btn) btn.textContent = tema === "dark" ? "☀️ Tema claro" : "🌙 Tema escuro";
  try { localStorage.setItem("painelSquadsTema", tema); } catch (e) { /* segue sem salvar */ }
  if (ultimoDados) render(ultimoDados);
}
function alternarTema() {
  const atual = document.documentElement.getAttribute("data-theme") || "dark";
  aplicarTema(atual === "dark" ? "light" : "dark");
}
(function iniciarTema() {
  let salvo = "dark";
  try { salvo = localStorage.getItem("painelSquadsTema") || "dark"; } catch (e) { /* ignora */ }
  document.documentElement.setAttribute("data-theme", salvo);
})();

// Tira o código numérico do início (ex: "082026 SEMANA 2 (AGO)" -> "SEMANA 2 (AGO)")
function limparSemanaLabel(label) {
  const s = String(label || "");
  const idx = s.toUpperCase().indexOf("SEMANA");
  return idx >= 0 ? s.slice(idx).trim() : s.trim();
}

// ===== Lê a aba de SQUADS (semanal + mensal) =====
// Estrutura confirmada linha a linha em 13/08/2026: soma dos vendedores de cada squad
// bate exatamente com a linha-resumo do squad (testado nos 4 squads, semana e mês, sem
// divergência). Não existe Meta Mensal por vendedor na aba — só no nível de squad, por
// isso este painel trabalha só com o total do squad (confirmado com o Felipe).
function parseSquads(payload) {
  const rows = payload.rows || [];
  const semanaLabel = rows[0] ? String(rows[0][0] || "").trim() : "";
  const mesLabel = rows[0] ? String(rows[0][9] || "").trim().replace(/[()]/g, "") : "";

  const headerIdx = rows.findIndex(r => r[1] === "Squad" && r[2] === "Meta");
  const squads = [];
  if (headerIdx >= 0) {
    for (let i = headerIdx + 1; i < rows.length; i++) {
      const r = rows[i];
      const nome = String(r[0] || "").trim().toUpperCase();
      if (!nome) break; // linha em branco = fim da tabela de squads
      if (EXCLUDE_SQUADS.includes(nome)) continue;
      const metaSemanal = toNum(r[2]);
      const faturadoSemanal = toNum(r[3]);
      const metaMensal = toNum(r[12]);
      const faturadoMensal = toNum(r[13]);
      squads.push({
        nome,
        metaSemanal, faturadoSemanal,
        pctSemanal: metaSemanal > 0 ? faturadoSemanal / metaSemanal : 0,
        metaMensal, faturadoMensal,
        pctMensal: metaMensal > 0 ? faturadoMensal / metaMensal : 0
      });
    }
  }
  return { semanaLabel, mesLabel, squads };
}

function ladderHtml(meta, fat) {
  // Só até 100% da meta — o .chip usa flex:1 1 0, então com menos patamares cada um
  // cresce e ocupa o espaço da régua inteira sozinho, ficando bem mais evidente.
  const tiers = [70, 80, 90, 100];
  let proximoMarcado = false;
  return tiers.map(t => {
    const faltaVal = (meta * t / 100) - fat;
    const isProximo = !proximoMarcado && faltaVal > 0;
    if (isProximo) proximoMarcado = true;
    const faltaTxt = faltaVal > 0 ? fmtBRL(faltaVal) : "batido ✓";
    return `
      <div class="chip ${isProximo ? 'proximo' : ''}">
        <div class="tier">${t}% da meta</div>
        <div class="valor">${faltaTxt}</div>
      </div>
    `;
  }).join("");
}

// Logo do squad em logos/{nome}.png (ex: logos/stark.png). Se o arquivo ainda não foi
// subido ou não existir, cai pras 3 primeiras letras do squad no lugar — nunca quebra.
const EXT_LOGO = ["png", "jpg", "jpeg", "webp"];
function squadLogoHtml(nome) {
  const slug = String(nome || "").toLowerCase().trim();
  const base = "logos/" + slug;
  const abrev = String(nome || "").slice(0, 3).toUpperCase();
  const extsJs = "['" + EXT_LOGO.join("','") + "']";
  const onerror = `data-tentativa="0" onerror="
    var i = parseInt(this.dataset.tentativa, 10) + 1;
    var exts = ${extsJs};
    if (i < exts.length) { this.dataset.tentativa = i; this.src = this.dataset.base + '.' + exts[i]; }
    else { this.remove(); }
  "`;
  return `<div class="corrida-logo">
    <img src="${base}.${EXT_LOGO[0]}" data-base="${base}" alt="" ${onerror}>
    ${abrev}
  </div>`;
}

// Escala do eixo: escolhe o menor "número redondo" que ainda cobre o maior valor com
// uma folga de ~5% — é assim que o próprio Google Sheets escala o eixo dos gráficos
// de referência (ex: eixo até 100% quando o maior valor é ~92%, até 40% quando é ~40%).
function eixoMaxNice(maxPct) {
  const candidatos = [0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1, 1.2, 1.4, 1.6, 1.8, 2, 2.5, 3, 4, 5, 6, 8, 10];
  for (const c of candidatos) { if (maxPct <= c * 0.995) return c; }
  return Math.ceil(maxPct * 1.1 * 10) / 10;
}

// Eixo COMPARTILHADO entre os 2 cards da mesma página (Closer e GC) — se cada card
// calculasse o próprio eixo isoladamente, um squad com % bem menor podia aparecer com
// barra maior só porque o card dele tinha uma escala menor (bug real, reportado pelo
// Felipe: Maverick 64% parecia maior que Stark 100% porque cada um tinha seu eixo).
function eixoMaxCompartilhado(gruposDeSquads, pctKey) {
  const todos = [].concat(...gruposDeSquads);
  const maxPct = Math.max(...todos.map(s => s[pctKey]), 0.01);
  return eixoMaxNice(maxPct);
}

// "Corrida" entre os 2 squads do mesmo grupo (Closer: Falcons x Stark · GC: Maverick x
// Nexus) — barra 3D grande, no mesmo espírito do gráfico de referência do Felipe.
// eixoMax é sempre o mesmo pros dois cards da página (ver eixoMaxCompartilhado acima),
// pra barra maior nunca representar um % menor.
function corridaHtml(titulo, squadsDoGrupo, periodo, eixoMax) {
  if (!squadsDoGrupo.length) return `<div class="corrida-titulo">${titulo}</div><div class="empty-msg">Sem dados no período.</div>`;
  const pctKey = periodo === "mensal" ? "pctMensal" : "pctSemanal";
  const ordenado = [...squadsDoGrupo].sort((a, b) => b[pctKey] - a[pctKey]);
  const cores = ["cor-1", "cor-2"];

  const linhas = ordenado.map((s, i) => {
    const pct = s[pctKey];
    const largura = Math.min(Math.max((pct / eixoMax) * 100, 6), 100);
    // Barra comprida (perto do fim do eixo): o valor não cabe mais fora do card à direita
    // e sumia (ficava posicionado além da borda). A partir daqui, mostra DENTRO da barra.
    const valorDentro = largura >= 78;
    return `
      <div class="corrida-row">
        <div class="corrida-logo-wrap">
          ${squadLogoHtml(s.nome)}
          <div class="corrida-posicao">${i === 0 ? "1º" : "2º"}</div>
        </div>
        <div class="corrida-bar-area">
          <div class="corrida-bar ${cores[i] || 'cor-2'}" style="width:${largura}%">
            <span class="corrida-bar-nome">${s.nome}</span>
            ${valorDentro ? `<span class="corrida-bar-valor-dentro">${fmtPct(pct)}</span>` : ""}
          </div>
          ${valorDentro ? "" : `<div class="corrida-bar-valor" style="left:${largura}%">${fmtPct(pct)}</div>`}
        </div>
      </div>
    `;
  }).join("");

  const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => eixoMax * f);
  const eixoHtml = `<div class="corrida-eixo-wrap"><div class="corrida-eixo">${ticks.map(t => `<span>${fmtPct(t)}</span>`).join("")}</div></div>`;

  return `<div class="corrida-titulo">${titulo}</div>${linhas}${eixoHtml}`;
}

function somaGrupo(squads, nomes, metaKey, fatKey) {
  const grupo = squads.filter(s => nomes.includes(s.nome));
  const meta = grupo.reduce((acc, s) => acc + s[metaKey], 0);
  const fat = grupo.reduce((acc, s) => acc + s[fatKey], 0);
  return { meta, fat, pct: meta > 0 ? fat / meta : 0, grupo };
}

// Mês abreviado (como vem da planilha, ex: "AGO") -> nome completo, pro rótulo da página mensal.
const MESES_EXTENSO = { JAN:"JANEIRO", FEV:"FEVEREIRO", MAR:"MARÇO", ABR:"ABRIL", MAI:"MAIO", JUN:"JUNHO", JUL:"JULHO", AGO:"AGOSTO", SET:"SETEMBRO", OUT:"OUTUBRO", NOV:"NOVEMBRO", DEZ:"DEZEMBRO" };
function formatarLabelMensal(mesLabel) {
  const m = String(mesLabel || "").trim().match(/([A-Za-zÇç]{3})\D*(\d{4})/);
  if (!m) return "Mensal " + (mesLabel || "");
  const abrev = m[1].toUpperCase();
  const ano = m[2];
  const extenso = MESES_EXTENSO[abrev] || abrev;
  return `MENSAL ${extenso}/${ano}`;
}

// Rótulo do cabeçalho troca conforme a página ativa (semanal x mensal) — preenchido no
// render() e lido pelo mostrarPagina() a cada troca de página.
let labelPorPagina = ["Semana comercial", "Mensal"];

function render(dados) {
  ultimoDados = dados;
  const { semanaLabel, mesLabel, squads } = dados;

  labelPorPagina = [limparSemanaLabel(semanaLabel) || "Semana comercial", formatarLabelMensal(mesLabel)];
  const semanaLabelEl = document.getElementById("semanaLabel");
  semanaLabelEl.textContent = labelPorPagina[paginaAtual] || labelPorPagina[0];
  semanaLabelEl.classList.toggle("semana--mensal", paginaAtual === 1);
  document.getElementById("atualizadoLabel").textContent = "última leitura: " + new Date().toLocaleString("pt-BR");

  const closerSem = somaGrupo(squads, CLOSER_SQUADS, "metaSemanal", "faturadoSemanal");
  const gcSem = somaGrupo(squads, GC_SQUADS, "metaSemanal", "faturadoSemanal");
  const eixoMaxSem = eixoMaxCompartilhado([closerSem.grupo, gcSem.grupo], "pctSemanal");

  const closerMes = somaGrupo(squads, CLOSER_SQUADS, "metaMensal", "faturadoMensal");
  const gcMes = somaGrupo(squads, GC_SQUADS, "metaMensal", "faturadoMensal");
  const eixoMaxMes = eixoMaxCompartilhado([closerMes.grupo, gcMes.grupo], "pctMensal");
  const totalMetaMes = closerMes.meta + gcMes.meta;
  const totalFatMes = closerMes.fat + gcMes.fat;
  const pctMes = totalMetaMes > 0 ? totalFatMes / totalMetaMes : 0;
  // Não existe "ritmo esperado" pro mês (o conceito é só semanal, dia-a-dia) — aqui o
  // status usa a própria % do mês contra 100% da meta mensal.
  const statusMes = statusFromRatio(pctMes);
  const barPctMes = Math.min(pctMes * 100, 100);
  // Projeção mensal: no ritmo do dia corrido do mês, quanto deve fechar até o último dia.
  // Mesma fórmula usada no painel individual mensal (projetarFechamento).
  const hoje = new Date();
  const diaDoMes = hoje.getDate();
  const diasNoMes = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0).getDate();
  const pctProjetadoMes = diaDoMes > 0 ? pctMes * (diasNoMes / diaDoMes) : pctMes;
  const statusProjecaoMes = statusFromRatio(pctProjetadoMes);
  const projMarkerPctMes = Math.min(pctProjetadoMes * 100, 100);

  document.getElementById("conteudo").innerHTML = `
    <div class="pagina" data-pagina="0">
      <div class="grid">
        <div class="card rank-card rank-card--destaque">
          ${corridaHtml("Corrida Semanal Closer", closerSem.grupo, "semanal", eixoMaxSem)}
        </div>

        <div class="card rank-card rank-card--destaque">
          ${corridaHtml("Corrida Semanal Gerentes de Contas", gcSem.grupo, "semanal", eixoMaxSem)}
        </div>
      </div>
    </div>

    <div class="pagina" data-pagina="1">
      <div class="grid">
        <div class="card hero">
          <div class="hero-top">
            <div>
              <div class="hero-num" style="color: var(--${statusMes})">${fmtPct(pctMes)}</div>
              <div class="hero-sub hero-sub--destaque">${fmtBRL(totalFatMes)} faturado de ${fmtBRL(totalMetaMes)} de meta mensal</div>
            </div>
          </div>
          <div class="bar-wrap">
            <div class="bar-fill" style="width:${barPctMes}%; background:var(--${statusMes})"></div>
            <div class="bar-marker" style="left:${projMarkerPctMes}%; background:var(--${statusProjecaoMes})"></div>
            <div class="bar-marker-label" style="left:${projMarkerPctMes}%; color:var(--${statusProjecaoMes})">Projeção Mensal ${fmtPct(pctProjetadoMes)}</div>
          </div>
          <div class="bar-legend"><span>0%</span><span>100% da meta mensal</span></div>
        </div>

        <div class="card ladder">
          <div class="card-label">🪜 Régua do mês — quanto falta pra bater cada patamar</div>
          <div class="ladder-row">${ladderHtml(totalMetaMes, totalFatMes)}</div>
        </div>

        <div class="card rank-card rank-card--destaque">
          ${corridaHtml("Corrida Mensal Closer", closerMes.grupo, "mensal", eixoMaxMes)}
        </div>

        <div class="card rank-card rank-card--destaque">
          ${corridaHtml("Corrida Mensal Gerentes de Contas", gcMes.grupo, "mensal", eixoMaxMes)}
        </div>
      </div>
    </div>
  `;

  mostrarPagina(paginaAtual);
  ajustarEscalaDasPaginas();
}

// Se o conteúdo de uma página não couber na altura disponível, aplica um zoom-out
// proporcional até caber por completo, sem distorcer nada. Só encolhe, nunca amplia
// (ampliar via transform aperta o layout interno numa largura menor que a real).
function ajustarEscalaPagina(paginaEl) {
  const grid = paginaEl.querySelector(":scope > .grid");
  if (!grid) return;
  grid.style.transform = "";
  grid.style.width = "";
  paginaEl.style.justifyContent = "";
  const alturaDisponivel = paginaEl.clientHeight;
  const alturaConteudo = grid.scrollHeight;
  if (alturaDisponivel > 0 && alturaConteudo > alturaDisponivel) {
    const fator = alturaDisponivel / alturaConteudo;
    grid.style.transformOrigin = "top left";
    grid.style.width = (100 / fator) + "%";
    grid.style.transform = `scale(${fator})`;
    // Sem isso, a centralização vertical do CSS ancora o encolhimento usando a altura
    // ORIGINAL (antes do scale), empurrando o topo do conteúdo pra fora da tela — corta
    // o início do texto. Alinhando pelo topo só quando encolhe, o scale(top left) começa
    // exatamente em y=0, sem cortar nada. Conteúdo que já cabe continua centralizado.
    paginaEl.style.justifyContent = "flex-start";
  }
}
function ajustarEscalaDasPaginas() {
  document.querySelectorAll("#conteudo .pagina").forEach(ajustarEscalaPagina);
}

function jsonpRequest(url) {
  return new Promise((resolve, reject) => {
    const callbackName = "painelCallback_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
    const script = document.createElement("script");
    let timeoutId;
    function cleanup() {
      clearTimeout(timeoutId);
      delete window[callbackName];
      script.remove();
    }
    window[callbackName] = function(data) {
      resolve(data);
      cleanup();
    };
    script.onerror = function() {
      reject(new Error("Falha ao carregar o Apps Script (verifique a URL/deploy)"));
      cleanup();
    };
    timeoutId = setTimeout(function() {
      reject(new Error("Tempo esgotado aguardando resposta do Apps Script"));
      cleanup();
    }, 25000);
    const sep = url.includes("?") ? "&" : "?";
    script.src = url + sep + "callback=" + callbackName + "&_=" + Date.now();
    document.body.appendChild(script);
  });
}

async function carregarDados() {
  try {
    const payload = await jsonpRequest(APPS_SCRIPT_URL + "&painel=squads");
    if (payload.error) throw new Error(payload.error);
    render(parseSquads(payload));
  } catch (e) {
    if (!ultimoDados) {
      document.getElementById("conteudo").innerHTML = `
        <div class="pagina pagina-ativa">
          <div class="grid">
            <div class="empty-msg" style="grid-column:span 12;">
              Erro ao carregar dados: ${e.message || e}<br>
              Verifique se a URL do Apps Script está correta, se o deploy está com acesso "Qualquer pessoa"
              e se a última versão implantada já tem o suporte a "painel=squads".
            </div>
          </div>
        </div>`;
    }
    console.error("Erro ao carregar painel de squads:", e);
    setTimeout(carregarDados, 30000);
  }
}

// ===== Paginação por fade: 2 páginas (Semana / Mês) =====
const DURACOES_PAGINA_MS = [25000, 25000];
let autoPaginacaoIniciada = false;
let paginaAtual = 0;
let direcaoPagina = 1;
let timerProximaPagina = null;
let paginacaoPausada = false;

function mostrarPagina(indice) {
  const paginas = document.querySelectorAll("#conteudo .pagina");
  paginas.forEach((p, i) => p.classList.toggle("pagina-ativa", i === indice));
  const label = document.getElementById("semanaLabel");
  if (label) {
    label.textContent = labelPorPagina[indice] || labelPorPagina[0];
    label.classList.toggle("semana--mensal", indice === 1);
  }
}
function agendarProximaPagina() {
  clearTimeout(timerProximaPagina);
  if (paginacaoPausada) return;
  const duracao = DURACOES_PAGINA_MS[paginaAtual] ?? 20000;
  timerProximaPagina = setTimeout(avancarPagina, duracao);
}
function alternarPausa() {
  paginacaoPausada = !paginacaoPausada;
  const btn = document.getElementById("btnPausar");
  if (btn) {
    btn.textContent = paginacaoPausada ? "▶" : "⏸";
    btn.title = paginacaoPausada ? "Retomar passagem de página" : "Pausar passagem de página";
    btn.setAttribute("aria-label", btn.title);
  }
  if (paginacaoPausada) {
    clearTimeout(timerProximaPagina);
  } else {
    agendarProximaPagina();
  }
}
function avancarPagina() {
  const totalPaginas = document.querySelectorAll("#conteudo .pagina").length;
  const ultimoIndice = totalPaginas - 1;
  if (ultimoIndice <= 0) {
    agendarProximaPagina();
    return;
  }
  if (paginaAtual + direcaoPagina > ultimoIndice || paginaAtual + direcaoPagina < 0) {
    direcaoPagina *= -1;
  }
  paginaAtual += direcaoPagina;
  mostrarPagina(paginaAtual);
  agendarProximaPagina();
}
function irPara(delta) {
  const totalPaginas = document.querySelectorAll("#conteudo .pagina").length;
  const ultimoIndice = totalPaginas - 1;
  if (ultimoIndice <= 0) return;
  let novoIndice = paginaAtual + delta;
  if (novoIndice > ultimoIndice) novoIndice = ultimoIndice;
  if (novoIndice < 0) novoIndice = 0;
  if (novoIndice === ultimoIndice) direcaoPagina = -1;
  else if (novoIndice === 0) direcaoPagina = 1;
  else direcaoPagina = delta >= 0 ? 1 : -1;
  paginaAtual = novoIndice;
  mostrarPagina(paginaAtual);
  agendarProximaPagina();
}
function iniciarAutoPaginacao() {
  if (autoPaginacaoIniciada) return;
  autoPaginacaoIniciada = true;
  paginaAtual = 0;
  direcaoPagina = 1;
  mostrarPagina(0);
  agendarProximaPagina();
}

(function sincronizarBotaoTema() {
  const tema = document.documentElement.getAttribute("data-theme") || "dark";
  const btn = document.getElementById("btnTema");
  if (btn) btn.textContent = tema === "dark" ? "☀️ Tema claro" : "🌙 Tema escuro";
})();

carregarDados();
setInterval(carregarDados, REFRESH_MS);
setTimeout(iniciarAutoPaginacao, 1500);
</script>
